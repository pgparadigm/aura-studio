<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Aura schema fixture tests</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 24px; background: #0d0a16; color: #e7e2f5;
    font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { color: #9a8fc4; margin: 0 0 18px; }
  #summary { font-size: 16px; font-weight: 700; padding: 10px 14px; border-radius: 8px; margin: 0 0 18px; display: inline-block; }
  .ok { background: #15351f; color: #79f2a6; border: 1px solid #2a6b41; }
  .bad { background: #3a1620; color: #ff9db2; border: 1px solid #7a2c40; }
  table { border-collapse: collapse; width: 100%; max-width: 900px; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid #241d38; vertical-align: top; }
  th { color: #b6a9e6; font-weight: 600; }
  td.res { font-weight: 700; white-space: nowrap; }
  .pass { color: #79f2a6; } .fail { color: #ff9db2; }
  .file { color: #d7ccff; } .note { color: #8f84b8; }
  .errs { color: #b89; font-size: 12px; margin-top: 3px; white-space: pre-wrap; }
  code { color: #cbe; }
</style>
</head>
<body>
<h1>Aura Studio — <code>.aura</code> schema fixture tests</h1>
<p class="sub">Each fixture is validated against <code>aura-project.schema.json</code>. A test passes when the actual result matches the expectation.</p>
<div id="summary">Running…</div>
<table>
  <thead><tr><th>Test</th><th>Fixture</th><th>Expect</th><th>Actual</th><th>Result</th></tr></thead>
  <tbody id="rows"></tbody>
</table>

<script src="schema-validate.js"></script>
<script>
// Each fixture, what it exercises, and whether it should pass the strict schema.
const CASES = [
  { file: 'complete.aura',             expect: 'pass', note: 'complete project (drums, chords, bass, melody, arrangement) — stands in for a real RT.aura' },
  { file: 'empty.aura',                expect: 'pass', note: 'empty project; all content flags false' },
  { file: 'unknown-fields.aura',       expect: 'pass', note: 'unknown optional fields are ignored (forward-compatible)' },
  { file: 'v13.3-all-blocks.aura',     expect: 'pass', note: 'a real 13.3 file from buildFile() — every optional block present, including groove.sf' },
  { file: 'future-schema.aura',        expect: 'fail', note: 'schemaVersion > 3 (newer format)' },
  { file: 'malformed.aura',            expect: 'fail', note: 'not valid JSON' },
  { file: 'oob-tempo.aura',            expect: 'fail', note: 'tempo out of range (300)' },
  { file: 'invalid-mode.aura',         expect: 'fail', note: 'mode not in the allowed set' },
  { file: 'bad-section-count.aura',    expect: 'fail', note: '5 pattern sections, not 6' },
  { file: 'bad-arrangement-length.aura', expect: 'fail', note: 'arrangement length 16, not 32' },
  { file: 'invalid-note-tuple.aura',   expect: 'fail', note: 'melody note pitch out of range' },
  { file: 'embedded-media.aura',       expect: 'fail', note: 'claims embedded audio — violates the mediaPersistence guarantee' },
  { file: 'legacy-v12.aura',           expect: 'fail', note: 'schema-1 bare compact — opened by the lenient in-app loader, not this strict schema' },
];

async function run() {
  const schema = await (await fetch('../aura-project.schema.json')).json();
  const rows = document.getElementById('rows');
  const results = [];
  for (const c of CASES) {
    let actual, errs = [];
    try {
      const text = await (await fetch(c.file)).text();
      let data;
      try { data = JSON.parse(text); }
      catch (e) { errs = ['not valid JSON: ' + e.message]; actual = 'fail'; }
      if (actual !== 'fail') {
        errs = AuraSchema.validate(schema, data);
        actual = errs.length ? 'fail' : 'pass';
      }
    } catch (e) {
      errs = ['could not load fixture: ' + e.message]; actual = 'error';
    }
    const passed = actual === c.expect;
    results.push({ ...c, actual, passed, errs });

    const tr = document.createElement('tr');
    tr.innerHTML =
      '<td class="note">' + c.note + '</td>' +
      '<td class="file">' + c.file + '</td>' +
      '<td>' + c.expect + '</td>' +
      '<td class="' + (actual === 'pass' ? 'pass' : 'fail') + '">' + actual +
        (errs.length ? '<div class="errs">' + errs.slice(0, 4).map(e => '• ' + e).join('\n') + (errs.length > 4 ? '\n• …' : '') + '</div>' : '') +
      '</td>' +
      '<td class="res ' + (passed ? 'pass' : 'fail') + '">' + (passed ? '✓ PASS' : '✗ FAIL') + '</td>';
    rows.appendChild(tr);
  }

  const passCount = results.filter(r => r.passed).length;
  const allPass = passCount === results.length;
  const s = document.getElementById('summary');
  s.textContent = passCount + ' / ' + results.length + ' tests passed';
  s.className = allPass ? 'ok' : 'bad';
  document.title = (allPass ? 'PASS ' : 'FAIL ') + passCount + '/' + results.length + ' — Aura schema tests';
  window.__RESULTS = { passCount, total: results.length, allPass, results };
}
run().catch(e => {
  const s = document.getElementById('summary');
  s.textContent = 'Harness error: ' + e.message; s.className = 'bad';
  document.title = 'ERROR — Aura schema tests';
  window.__RESULTS = { error: String(e) };
});
</script>
</body>
</html>
